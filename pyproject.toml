[project]
name = "datasec"
version = "0.1.0"
description = "Provenance-first security middleware core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=43"]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[dependency-groups]
dev = ["pytest>=8", "cryptography>=43"]
webapp = ["fastapi>=0.115", "uvicorn>=0.30", "anthropic>=1.0", "google-genai>=1.0", "python-dotenv>=1.0", "httpx>=0.27"]
presidio-model = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "presidio: needs the optional presidio extra and the en_core_web_lg model",
    "live: calls real LLM APIs with keys from .env; opt in with -m live",
]
addopts = ["-m", "not live"]
